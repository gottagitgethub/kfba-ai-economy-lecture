`계좌 비밀번호나 주문 권한은 연결하지 않는다는 원칙을 강조합니다.`},{id:`idea`,chapter:`2 · 가설 만들기`,title:`‘오를 것 같다’에서 한 걸음 더`,minute:`18—21`,note:`아이디어와 검증 가능한 가설의 차이를 짧은 예문으로 보여줍니다.`},{id:`thesis-cells`,chapter:`2 · 가설 만들기`,title:`가설에는 네 칸이 필요합니다`,minute:`21—25`,note:`원인에서 가격 영향까지 중간 고리가 빠지지 않았는지 확인합니다.`},{id:`before-after`,chapter:`2 · 가설 만들기`,title:`좋은 재료가 가격까지 닿는 길`,minute:`25—28`,note:`막연한 문장을 관측 가능한 문장으로 고쳐 읽습니다.`},{id:`thesis-lab`,chapter:`2 · 가설 만들기`,title:`내 아이디어를 한 문장 가설로 바꿔봅니다`,minute:`28—35`,note:`7분 실습입니다. 대상, 기간, 생각, 근거를 채우게 합니다.`},{id:`scenario-meaning`,chapter:`3 · 시나리오 설계`,title:`상승·횡보·하락을 함께 적습니다`,minute:`35—39`,note:`각 시나리오는 기분이 아니라 조건으로 정의해야 한다고 설명합니다.`},{id:`probability`,chapter:`3 · 시나리오 설계`,title:`가중치는 지금 시점의 판단입니다`,minute:`39—45`,note:`합계 100으로 조정하되, 숫자의 근거를 말할 수 있는지 묻습니다.`},{id:`signals`,chapter:`3 · 시나리오 설계`,title:`시나리오가 바뀌는 신호를 먼저 정합니다`,minute:`45—50`,note:`전환 기준은 숫자나 확인 가능한 사건으로 적게 합니다.`},{id:`case`,chapter:`3 · 시나리오 설계`,title:`예시 · 에너지 기업의 세 갈래`,minute:`50—54`,note:`같은 기업도 원가, 수요, 정책 조건에 따라 대응이 달라짐을 보여줍니다.`},{id:`break`,chapter:`BREAK`,title:`7분 쉬었다가, 내 가설의 빈칸을 채웁니다`,minute:`54—61`,note:`휴식 뒤 61분에 다시 시작합니다.`},{id:`prompt-anatomy`,chapter:`4 · Hermes 실습`,title:`조사 순서를 구체적으로 알려줍니다`,minute:`61—65`,note:`역할, 입력, 절차, 출처, 출력 형식을 차례로 설명합니다.`},{id:`generated-prompt`,chapter:`4 · Hermes 실습`,title:`방금 적은 내용으로 조사 요청을 만듭니다`,minute:`65—71`,note:`생성된 문장을 검토한 뒤 Hermes에 복사합니다.`},{id:`demo`,chapter:`4 · Hermes 실습`,title:`Hermes 결과는 이 순서로 확인합니다`,minute:`71—76`,note:`결과보다 출처와 반대 근거를 확인하는 과정을 보여줍니다.`},{id:`prompt-library`,chapter:`4 · Hermes 실습`,title:`필요한 순간에 골라 쓰는 여덟 가지 요청`,minute:`76—79`,note:`목록에서 하나를 열고 복사하는 방법만 보여줍니다.`},{id:`red-team`,chapter:`5 · 대응전략`,title:`내 생각에 유리한 자료만 모으고 있지 않은가?`,minute:`79—83`,note:`가장 강한 반대 근거를 먼저 찾도록 요청합니다.`},{id:`four-lines`,chapter:`5 · 대응전략`,title:`행동 계획에는 네 줄이면 충분합니다`,minute:`83—86`,note:`조건, 신호, 행동, 무효화의 네 줄을 소리 내어 읽습니다.`},{id:`strategy-lab`,chapter:`5 · 대응전략`,title:`세 시나리오의 행동을 미리 적어둡니다`,minute:`86—94`,note:`8분 실습입니다. ‘그때 생각한다’는 문장을 남기지 않게 합니다.`},{id:`common-rules`,chapter:`5 · 대응전략`,title:`어느 시나리오에서도 지키는 공통 규칙`,minute:`94—97`,note:`분할, 최대 비중, 원문 확인, 재검토일을 공통 규칙으로 묶습니다.`},{id:`calculator`,chapter:`5 · 대응전략`,title:`감당할 수 있는 손실에서 비중을 계산합니다`,minute:`97—103`,note:`계산값은 참고치이며 실제 체결 손실은 더 커질 수 있다고 설명합니다.`},{id:`evidence`,chapter:`6 · 검증과 기록`,title:`사실과 판단을 한 문장에 섞지 않습니다`,minute:`103—107`,note:`사실, 추론, 가정, 반증 조건의 차이를 예문으로 구분합니다.`},{id:`checklist`,chapter:`6 · 검증과 기록`,title:`결정 전에 아홉 가지를 확인합니다`,minute:`107—113`,note:`체크 수보다 빠진 항목이 무엇인지 살펴보게 합니다.`},{id:`journal`,chapter:`6 · 검증과 기록`,title:`결정 당시의 근거를 남겨둡니다`,minute:`113—118`,note:`결정, 근거, 반대 근거, 무효화, 다음 검토일을 기록합니다.`},{id:`sources`,chapter:`REFERENCE`,title:`원문에 가까운 자료부터 확인합니다`,minute:`118—119`,note:`강의에서 참고한 공식 문서와 투자자 교육 자료입니다.`},{id:`closing`,chapter:`CLOSING`,title:`다음 검토일까지 무엇을 볼지 정합니다`,minute:`119—120`,note:`오늘 만든 표에서 바로 할 일 하나를 고르게 합니다.`}],re=[{id:`idea`,number:`01`,title:`아이디어를 가설로 바꾸기`,use:`막연한 생각을 검증 가능한 문장으로 정리할 때`,body:`투자 가설을 검토하기 쉽도록 자료를 정리하는 리서치 파트너로 작업해줘.

[판단 대상] {자산·기업·테마}
[판단 기간] {예: 6개월}
[현재 생각] {내 아이디어}
[알고 있는 근거] {뉴스·공시·통계·링크}

다음 순서로 작성해줘.
1. 원인 → 전달 경로 → 관측 가능한 결과 → 가격 영향의 한 문장 가설
2. 확인된 사실, 추론, 아직 확인하지 못한 가정
3. 가설이 맞다면 먼저 나타날 지표 3개
4. 가설을 가장 강하게 반박할 증거 3개
5. 더 확인해야 할 원문 목록

모든 사실에는 원문 URL, 발표기관, 발표일, 데이터 기준일을 붙여줘. 확인하지 못한 숫자는 추정하지 말고 ‘확인 필요’로 표시해줘.`},{id:`research`,number:`02`,title:`출처 우선 리서치`,use:`요약 기사보다 원자료부터 찾게 할 때`,body:`다음 투자 가설을 조사해줘: {가설}
기준일: {YYYY-MM-DD}
판단 기간: {기간}

검색 순서는 ① 정부·규제기관 ② 기업 공시·실적자료 ③ 거래소·산업기관 ④ 신뢰할 수 있는 2차 자료로 해줘.

- 최근 자료와 가설에 불리한 자료를 함께 찾는다.
- 주장마다 원문 URL, 문서명, 발표일, 데이터 기준일을 표시한다.
- 사실 / 추론 / 가정을 구분한다.
- 원문을 열지 못했거나 숫자를 확인하지 못했다면 적어둔다.

마지막에는 ‘주장 | 분류 | 지지 근거 | 반대 근거 | 기준일 | 추가 확인’ 표로 정리해줘.`},{id:`scenario`,number:`03`,title:`세 갈래 시나리오`,use:`상승·횡보·하락을 같은 기준으로 비교할 때`,body:`아래 가설을 상승·횡보·하락의 세 시나리오로 나눠줘.

[자산] {자산}
[가설] {한 문장 가설}
[기간] {기간}
[현재 확인한 사실] {출처가 있는 사실}
[내 임시 가중치] 상승 {00}% / 횡보 {00}% / 하락 {00}%

각 시나리오마다 다음을 같은 표로 작성해줘.
1. 성립 조건
2. 먼저 볼 지표 3개
3. 상태 전환을 선언할 숫자 또는 사건
4. 현재 가격에 반영됐을 가능성
5. 대응 행동
6. 무효화 조건
7. 다음 검토일

새로운 확률을 임의로 만들지 말고, 입력한 가중치는 주관적 판단이라고 표시해줘.`},{id:`redteam`,number:`04`,title:`내 아이디어 공격하기`,use:`확인편향을 점검하고 싶을 때`,body:`내 투자 아이디어를 설득하지 말고, 실패 가능성을 찾는 독립 검토자 역할을 해줘.

[가설] {가설}
[보유 근거] {근거}
[기간] {기간}

다음을 확인해줘.
- 논리에서 가장 약한 인과 고리 3개
- 사실처럼 적었지만 실제로는 가정인 문장
- 기대가 이미 가격에 반영됐을 가능성
- 방향은 맞아도 손실이 날 수 있는 경로
- 내 생각을 바꾸게 할 최소 증거

반론마다 강도를 표시하고 원문 URL과 기준일을 붙여줘. 마지막에는 ‘결론을 보류할 이유’와 ‘그래도 남는 근거’를 나눠 적어줘.`},{id:`transition`,number:`05`,title:`전환 신호 감시표`,use:`뉴스가 많아도 판단 기준을 유지하고 싶을 때`,body:`다음 세 시나리오 사이의 전환 신호를 감시표로 만들어줘.

[상승 조건] {조건}
[횡보 조건] {조건}
[하락 조건] {조건}
[검토 주기] {매주 / 매월}

열은 ‘지표 | 원자료 URL | 현재값 기준일 | 상승 전환 기준 | 하락 전환 기준 | 확인 주기 | 해석 주의점’으로 해줘.

지표는 7개 이내로 제한하고, 가설보다 먼저 움직일 가능성이 큰 순서로 정렬해줘. 새 값이 발표되지 않았다면 추정하지 말고 ‘미발표’로 표시해줘.`},{id:`risk`,number:`06`,title:`행동과 위험 규칙`,use:`좋은 이야기와 실행 계획을 분리할 때`,body:`한 번의 오판이 전체 계획을 흔들지 않도록 위험관리 초안을 만들어줘.

[시나리오 표] {앞서 만든 표}
[전체 포트폴리오] {금액 또는 100 기준}
[허용 가능한 1회 최대 손실] {비율}
[현재 집중 위험] {섹터·국가·통화·레버리지}

시나리오별로 다음을 적어줘.
- 행동 전 확인할 증거
- 분할 실행 규칙
- 최대 비중과 이유
- 무효화 조건과 재검토 조건
- 급변·미체결 상황의 예외
- 아무것도 하지 않는 편이 나은 조건

실제 주문을 실행하지 말고 교육용 의사결정 초안만 작성해줘.`},{id:`memo`,number:`07`,title:`1페이지 결정 메모`,use:`행동 직전에 생각을 짧게 고정할 때`,body:`지금까지의 조사 결과를 1페이지 투자 결정 메모로 정리해줘.

제목 / 기준일 / 판단 기간
1. 한 문장 가설
2. 확인된 핵심 사실 3개
3. 가장 강한 반대 근거 2개
4. 세 시나리오 가중치와 전환 신호
5. 오늘의 결정: 관찰 / 진입 / 유지 / 축소 / 청산
6. 최대 허용 손실과 무효화 조건
