name: Build lecture PDF

on:
  push:
    branches:
      - main
    paths:
      - investment-os/index.html
      - investment-os/generate-pdf.mjs
      - .github/workflows/build-lecture-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lecture-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Korean fonts and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          fc-cache -f

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Generate lecture PDF
        run: node investment-os/generate-pdf.mjs

      - name: Verify 74-page PDF
        run: |
          pdfinfo investment-os/hermes-investment-os-lecture.pdf
          pages="$(pdfinfo investment-os/hermes-investment-os-lecture.pdf | awk '/^Pages:/ { print $2 }')"
          echo "Generated $pages pages."
          test "$pages" = "74"

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investment-os/hermes-investment-os-lecture.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
            exit 0
          fi
          git commit -m "docs: refresh downloadable lecture PDF"
          git push

      - name: Upload PDF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-investment-os-lecture
          path: investment-os/hermes-investment-os-lecture.pdf
